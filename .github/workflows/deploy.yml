name: ADLC Step 8 — Deploy

on:
  workflow_dispatch:
    inputs:
      epic_key:
        required: true
        type: string
        description: "Jira Epic/subtask key (e.g. SHOP-27)"
      version:
        required: true
        type: string
        description: "Release version (e.g. v1.1.0)"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Verify build
        id: build
        working-directory: frontend
        run: |
          npm test
          npm run build

      - name: Deploy
        id: deploy
        run: |
          echo "Deploying ${{ github.repository }} ${{ inputs.version }} for ${{ inputs.epic_key }}"
          # TODO: real deploy steps go here. Left as a no-op so the pipeline
          # completes end-to-end; the tag below is the part Step 8 observes.
        continue-on-error: true

      - name: Create Git tag
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }} — ${{ inputs.epic_key }}"
          git push origin "${{ inputs.version }}"
